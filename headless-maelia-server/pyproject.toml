[project]
name = "headless-maelia-server"
version = "0.1.0"
description = "Backend Python (FastAPI) de la plateforme headless-MAELIA — pilotage de GAMA headless"
requires-python = ">=3.12,<3.13"

dependencies = [
    # ── API HTTP ────────────────────────────────────────────────────────────
    "fastapi>=0.141,<0.142",
    "python-multipart>=0.0.32,<0.0.33",   # uploads CSV / ZIP / shapefiles
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",

    # ── Serveur ASGI ────────────────────────────────────────────────────────
    # ATTENTION : on N'UTILISE PAS l'extra [standard].
    # uvicorn[standard] exige websockets>=13, or gama-client 2.0.1 épingle
    # websockets~=10.3 → résolution impossible. On reprend donc à la main les
    # composants de [standard] SAUF websockets, et le protocole WebSocket
    # serveur est assuré par wsproto (lancer uvicorn avec `--ws wsproto`).
    "uvicorn>=0.52,<0.53",
    "wsproto>=1.3,<2",                    # impl. WebSocket serveur, sans conflit
    "httptools>=0.8,<0.9",                # parseur HTTP rapide
    "watchfiles>=1.2,<2",                 # --reload en dev
    "python-dotenv>=1.2,<2",
    "uvloop>=0.22,<0.23; sys_platform != 'win32'",

    # ── Pilotage GAMA headless ──────────────────────────────────────────────
    # Tire websockets 10.4 (dernière version compatible avec son pin ~=10.3),
    # utilisée uniquement pour la connexion SORTANTE vers gama-headless.
    "gama-client>=2.0.1,<3",

    # ── Persistance ─────────────────────────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.52,<3",
    "alembic>=1.19,<2",
    "asyncpg>=0.31,<0.32",                # runtime applicatif (async)
    "psycopg[binary]>=3.3,<4",            # migrations Alembic (sync)
    "geoalchemy2>=0.20,<0.21",            # colonnes PostGIS (cartes choroplèthes)

    # ── File de tâches + temps réel ─────────────────────────────────────────
    "arq>=0.28,<0.29",                    # remplace RabbitMQ + Spring AMQP
    # arq 0.28 exige redis[hiredis]>=4.2,<6 : ne PAS monter en redis 6+/8+,
    # la résolution échoue. hiredis = parseur C, utile pour le pub/sub temps réel.
    "redis[hiredis]>=5.0,<6",             # broker ARQ + pub/sub worker → api

    # ── Stockage objet ──────────────────────────────────────────────────────
    "minio>=7.2,<8",

    # ── Données MAELIA ──────────────────────────────────────────────────────
    "pyshp>=3.1,<4",                      # lecture .shp/.dbf sans dépendance GDAL

    # ── Observabilité ───────────────────────────────────────────────────────
    "structlog>=26.1,<27",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "httpx>=0.28,<0.29",                  # client de test FastAPI
    "ruff>=0.16,<0.17",
    "mypy>=2.3,<3",
]

# Projet « virtuel » : uv installe les dépendances sans empaqueter app/.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
