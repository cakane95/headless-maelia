# Servi uniquement par la cible `prod` du Dockerfile.
# En dev, le compose utilise le serveur Vite (port 5173) et ce fichier est ignoré.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA : toute route inconnue retombe sur index.html (react-router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API — évite le CORS en production.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket temps réel des runs (suivi de progression).
    location /ws/ {
        proxy_pass http://api:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Un run MAELIA dure longtemps : pas de coupure prématurée.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
