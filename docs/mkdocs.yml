site_name: Plateforme MAELIA
site_description: >-
  Documentation de la plateforme web de gestion de projets de simulation MAELIA
  (eau / agriculture / normes) sur moteur GAMA.
site_author: LHackSRT · UMMISCO
copyright: © LHackSRT · UMMISCO — Plateforme MAELIA
docs_dir: docs

theme:
  name: material
  language: fr
  # Le logo/favicon sont repris de la charte du frontend (icône « eau »).
  icon:
    logo: material/water
    repo: fontawesome/brands/git-alt
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    # Mode clair — teal MAELIA (primary-600)
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Passer en mode sombre
    # Mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Passer en mode clair
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    # Les pages d'archive se retirent de la recherche par leur front matter :
    # sans cela un lecteur y retombe et prend un design abandonne pour la realite.
    - search.exclude
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # Les chiffres du modele vivent dans docs/_partials/ et nulle part ailleurs.
  # check_paths casse la construction si un fragment disparait.
  - pymdownx.snippets:
      base_path: ['.', 'docs']
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Accueil: index.md
  - Comprendre:
      - Pourquoi une plateforme: comprendre/pourquoi.md
      - Administration et Simulation: comprendre/les-deux-domaines.md
      - Le modèle MAELIA en bref: comprendre/maelia-en-bref.md
      - Rien n'est écrit dans le code: comprendre/rien-n-est-code-en-dur.md
      - Le langage de conditions: comprendre/langage-de-conditions.md
      - Ce que MAELIA écrit: comprendre/ce-que-maelia-ecrit.md
      - L'isolation des exécutions: comprendre/isolation-des-executions.md
      - Pièges de GAMA et de MAELIA: comprendre/pieges-gama-maelia.md
      - L'héritage de la version Java: comprendre/heritage-java.md
  - Archive:
      - Documentation antérieure: archive/index.md
      - Accueil (2025): archive/accueil.md
      - Architecture backend: archive/backend.md
      - Backend — bonnes pratiques: archive/backend-bonnes-pratiques.md
      - Backend — les domaines: archive/backend-domaines.md
      - Architecture frontend: archive/frontend.md
      - Frontend — bonnes pratiques: archive/frontend-bonnes-pratiques.md
      - Modèle de domaine — données d'entrée: archive/modele-domaine-donnees-entree.md
      - Données, sorties et paramètres: archive/donnees-et-parametres.md

extra:
  social:
    - icon: fontawesome/brands/git-alt
      link: "#"
      name: Dépôt Git